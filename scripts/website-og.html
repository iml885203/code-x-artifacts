<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CodeXArtifacts social card source</title>
  <style>
    @font-face { font-family: Familjen; src: url('../website/fonts/FamiljenGrotesk.woff2') format('woff2'); font-weight: 400 700; }
    * { box-sizing: border-box; }
    html,body { width:1200px; height:630px; margin:0; overflow:hidden; }
    body { padding:48px 52px; background:#f5f3ed; color:#211e20; font-family:Familjen,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:14px; font-size:36px; font-weight:650; letter-spacing:-.03em; }
    .brand img { width:43px; height:43px; }
    .domain { color:#625b60; font-size:19px; }
    main { display:grid; grid-template-columns:490px 562px; gap:44px; align-items:center; margin-top:56px; }
    h1 { margin:0; font-size:70px; line-height:1.02; font-weight:600; letter-spacing:-.035em; }
    .tagline { margin:20px 0 0; font-size:32px; line-height:1.15; color:#ad4968; font-weight:500; letter-spacing:-.02em; }
    .description { margin:22px 0 0; color:#625b60; font-size:23px; line-height:1.4; }
    .product { padding:9px; background:#191d24; border-radius:15px; box-shadow:0 20px 35px #33242b1f; }
    .product img { display:block; width:100%; height:auto; border-radius:7px; }
    footer { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:53px; padding-top:24px; border-top:1px solid #d8d1d1; font-size:19px; color:#625b60; }
    .features { display:flex; gap:22px; }
    .principles { color:#8e3451; }
  </style>
</head>
<body>
  <header><div class="brand"><img src="../website/mark.svg" alt="">CodeXArtifacts</div><span class="domain">code-x-artifacts.ilogan.app</span></header>
  <main><div><h1>Turn ideas<br>into artifacts.</h1><p class="tagline">Keep creating value.</p><p class="description">A shared workspace for you<br>and your AI agents.</p></div><div class="product"><img src="../website/screenshots/overview.webp" alt="Actual CodeXArtifacts library with demonstration content"></div></main>
  <footer><div class="features"><span>Web page</span><span>Doc</span><span>Slides</span><span>Design</span><span>Board</span></div><span class="principles">Self-hosted · Open source · MCP</span></footer>
</body>
</html>
