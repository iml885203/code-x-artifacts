<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Multiple AI agents, one CodeXArtifacts workspace</title>
  <desc id="desc">Claude Code, Codex, Cursor, OpenCode and other MCP clients each connect using their own personal token through the MCP endpoint to the same CodeXArtifacts workspace, with shared artifacts, files and versions subject to token permissions.</desc>
