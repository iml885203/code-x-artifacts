    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#ad4968" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="480" rx="22" fill="#f5f3ed"/>
  <g fill="none" stroke="#c39aa8" stroke-width="2">
    <path d="M232 76C285 76 285 230 338 230"/>
    <path d="M232 154C285 154 285 230 338 230"/>
    <path d="M232 232H338"/>
    <path d="M232 310C285 310 285 230 338 230"/>
    <path d="M232 388C285 388 285 230 338 230"/>
  </g>
  <path d="M474 230H553" fill="none" stroke="#ad4968" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#d8d1d1">
      <rect x="28" y="46" width="204" height="60" rx="12"/>
